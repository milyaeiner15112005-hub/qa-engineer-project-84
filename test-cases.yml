- summary: |
    Успешная проверка поиска товара по ключевому слову 
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта страница со списком товаров для покупки
  test-data: |
    Search = chicken
  steps: 
    - Вводим в поиск "chicken"
  expected-result: |
    В списке товаров останется товар Chicken Meat

- summary: |
    Успешная проверка поиска товара по категории
