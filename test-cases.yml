- summary: |
    Успешная проверка оптимизации скорости работы сайта на Fast 4G
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы на Fast 4G
  prerequisites: |
    Открыта страница со списком товаров для покупки
    Открыты DevTools
