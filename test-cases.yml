---
- summary: |
    Успешная проверка поиска товара по ключевому слову 
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта страница со списком товаров для покупки
  test-data: |
    Search = chicken
  steps: |
    Вводим в поиск "chicken"
  expected-result: |
    В списке товаров останется Chicken Meat

- summary: |
    Успешная проверка поиска товара по категории
  requirement: |
    Пользователь должен иметь возможность искать товары по категории
  prerequisites: |
    Открыта страница со списком товаров для покупки
  test-data: |
    Category = beauty
  steps: |
    Выбираем Category
  expected-result: |
    В списке товаров останутся товары с хештегом "beauty"
    
- summary: |
    Успешная проверка фильтрации товаров
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница со списком товаров для покупки
  test-data: 
    - Brand = Annibale Colombo
    - In Stock = In Stock
    - Price = "Frome 0 - To 2000"
  steps: 
    - Выбираем Brand
    - Выбираем In Stock
    - Вводим Price
  expected-result: |
    В списке товаров останется Annibale Colombo Bed
    
- summary: |
    Успешная проверка просмотра списка товаров
  requirement: |
    Пользователь должен иметь возможность просматривать товары
  prerequisites: |
    Открыта страница со списком товаров в корзине
  steps: |
    Нажимаем на кнопку "Store"
  expected-result: |
    Пользователь видит страницу со списком товаров для покупки
    
- summary: |
    Успешная проверка просмотра подробной инфорации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта страница со списком товаров для покупки
  steps: |
    Нажимаем на первый блок с карточкой товара
  expected-result: |
    Пользователь видит страницу с подробной информацией о выбранном товаре

- summary: |
    Успешная проверка добавления товара в корзину и её просмотра
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: 
    - Открыта страница со списком товаров для покупки
    - Корзина пуста
  steps: 
    - Нажимаем на кнопку "Add to cart"
    - Нажимаем на кнопку "Cart"
  expected-result: |
    Пользователь видит страницу с добавленным в корзину товаром

- summary: |
    Успешная проверка оптимизации скорости работы сайта
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  prerequisites: 
    - Открыта страница со списком товаров для покупки
    - Открыты DevTools
  steps: 
    - Нажимаем "Ctrl+Shift+M"
    - В выпадающем списке нажать Fast 4G 
    - Перезагрузить страницу
    - В выпадающем списке нажать Slow 4G
    - Перезагрузить страницу
    - В выпадающем списке нажать 3G
    - Перезагрузить страницу
  expected-result: |
    На каждых скоростях работы пользователь сначала видит спиннер, затем текст страницы со списком товаров для покупки и затем изображения

- summary: |
    Успешная проверка безопасности сайта
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыта страница со списком товаров для покупки
  test-data: |
    Search = <h1>hello</h1>
  steps: |
    Вводим в поиск <h1>hello</h1>
  expected-result: |
    Код в поиске не был исполнен, осталась запись <h1>hello</h1>

- summary: |
    Успешная проверка мобильной версии сайта
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: 
    - Открыта страница со списком товаров для покупки
    - Открыты DevTools
  test-data: |
    Dimensions = iPhone SE
  steps: 
    - Нажимаем "Ctrl+Shift+M"
    - Выбираем Dimensions
  expected-result: |
    Кнопки, текст, изображения никуда не съехали, за края блока не вылезли, все читабельно

