bugreports:
  - summary: |
      Поля ввода увеличились, когда в списке товаров для покупки остается один товар
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть страницу со списком товаров в корзине
      Выбрать Essence в фильтре Brand
      Выбрать In Stock
    expected-result: |
      Поля ввода в фильтре не меняют своего размера
    actual-result: |
      Поле поиска и ввода цены увеличились
      Ошибка изображена на скриншоте Рисунок18.png

  - summary: |
      Вместо "Nothing found!" в списке товаров для покупки выдает весь список 
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть страницу со списком товаров в корзине
      Выбрать Essence в фильтре Brand
      Убрать In Stock
    expected-result: |
      Вместо списка товаров для покупки отображается надпись "Nothing found!"
    actual-result: |
      Вместо надписи "Nothing found!" в списке товаров для покупки отображается весь список товаров
      Ошибка изображена на скриншоте Рисунок19.png

  - summary: |
      Сайт не адаптивен к мобильной версии iPhone SE
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть DevTools
      Нажимаем Ctrl+Shift+M
      Выбираем iPhone SE в Dimensions
    expected-result: |
      Все элементы сайта никуда не съехали, за края блока не вылезли, все читабельно
    actual-result: |
      Изображения обрезались, блок с фильтром находится в конце страницы со списком товаров для покупки
      Текст на странице корзины съехал и выходит за пределы блока
      Ошибка изображена на скриншотах Рисунок20.png, РРисунок21.png и Рисунок22.png

  - summary: |
      Сайт не адаптивен к мобильной версии Samsung Galaxy A51/71
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть DevTools
      Нажимаем Ctrl+Shift+M
      Выбираем Samsung Galaxy A51/71 в Dimensions
    expected-result: |
      Все элементы сайта никуда не съехали, за края блока не вылезли, все читабельно
    actual-result: |
      Изображения обрезались, блок с фильтром находится в конце страницы со списком товаров для покупки
      Текст на странице корзины съехал и выходит за пределы блока
      Ошибка изображена на скриншотах Рисунок20.png, РРисунок21.png и Рисунок22.png

  - summary: |
      Сайт не адаптивен к мобильной версии iPhone XR
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть DevTools
      Нажимаем Ctrl+Shift+M
      Выбираем iPhone XR в Dimensions
    expected-result: |
      Все элементы сайта никуда не съехали, за края блока не вылезли, все читабельно
    actual-result: |
      Изображения обрезались, блок с фильтром находится в конце страницы со списком товаров для покупки
      Текст на странице корзины съехал и выходит за пределы блока
      Ошибка изображена на скриншотах Рисунок20.png, РРисунок21.png и Рисунок22.png

  - summary: |
      Сайт неполностью переводится на русский язык
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Нажать на кнопку "Language"
      Выбрать Russian
    expected-result: |
      Текст сайта полностью переведен на русский язык
    actual-result: |
      Описание товара, скидка и название языков не переведено
      Ошибка изображена на скриншотах Рисунок11.png и Рисунок12.png

  - summary: |
      Сервер возвращает заказ товара с ошибкой 500
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть страницу со списком товаров в корзине
      Нажать на кнопку "Add to cart" в первой карточке товара
      Нажать на кнопку "Cart"
      Открыть Network в DevTools
      Нажать на кнопку "Checkout"
    expected-result: |
      Сервер обработал запрос со статусом 200 ОК
    actual-result: |
      Сервер обработал запрос со статусом 500 Internal Server Error

  - summary: |
      Сайт не адаптивен к разрешению телефона
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть DevTools 
      Нажать Ctrl+Shift+M
      Ввести разрешение 375*812
      Нажать Enter
    expected-result: |
      Все элементы сайта никуда не съехали, за края блока не вылезли, все читабельно
    actual-result: |
      Изображения обрезались, блок с фильтром находится в конце страницы со списком товаров для покупки
      Текст на странице корзины съехал и выходит за пределы блока
      Ошибка изображена на скриншотах Рисунок20.png, РРисунок21.png и Рисунок22.png

  - summary: |
      Сайт не адаптивен к разрешению планшета
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть DevTools 
      Нажать Ctrl+Shift+M
      Ввести разрешение 768*1024
      Нажать Enter
    expected-result: |
      Все элементы сайта никуда не съехали, за края блока не вылезли, все читабельно
    actual-result: |
      Левая граница поля поиска не отображается, изображения на странице списка товаров для покупки обрезаны
      Ошибка изображена на скриншоте Рисунок23.png 

  - summary: |
      Нельзя выбрать несколько категорий
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть страницу со списком товаров для покупки
      Выбираем две Category сразу: beauty и furniture
    expected-result: |
      В списке товаров остались лишь товары из категорий beauty и furniture
    actual-result: |
      Нет возможности выбрать более, чем одну категорию 

  - summary: |
      Можно ввести негативное число в поле цены
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть страницу со списком товаров для покупки
      Вводим в поле Price значение -1
    expected-result: |
      Спецсимвол - невозможно ввести в поле цены
    actual-result: |
      Сайт позволяет ввести в поле цены отрицательное число

  - summary: |
      Сайт не оптимизирован для скорости интернета 3G
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Открыть страницу со списком товаров для покупки
      Открыть DevTools
      Нажать "Ctrl+Shift+M"
      В выпадающем списке нажать 3G 
      Перезагрузить страницу
    expected-result: |
      Пользователь сначала видит спиннер, затем текст страницы со списком товаров для покупки и затем изображения
    actual-result: |
      Пользователь в течение 9 секунд видит белый экран, только после этого появляется спиннер, затем текст и изображения

  - summary: |
      После перезагрузки страницы перевод на русский не сохраняется
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Нажать на кнопку "Language"
      Выбрать Russian 
      Перезагрузить страницу
    expected-result: |
      Перевод сайта на русский сохранился
    actual-result: |
      Перевод сайта сбрасывается до английского, который стоит по умолчанию 

  - summary: |
      После перезагрузки страницы перевод на испанский не сохраняется
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
    steps-to-reproduce: |
      Нажать на кнопку "Language"
      Выбрать Spanish 
      Перезагрузить страницу
    expected-result: |
      Перевод сайта на испанский сохранился
    actual-result: |
      Перевод сайта сбрасывается до английского, который стоит по умолчанию 
