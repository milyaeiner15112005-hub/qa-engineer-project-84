bugreports:
  - summary: |
      Поля ввода увеличились, когда в списке товаров для покупки остается один товар
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
      2 версия веб-приложения https://products-store-v2.hexlet.app/ 
    steps-to-reproduce: |
      Открыть страницу со списком товаров в корзине
      Выбрать Essence в фильтре Brand
      Выбрать In Stock
    expected-result: |
      Поля ввода в фильтре не меняют своего размера
    actual-result: |
      Поле поиска и ввода цены увеличились: 346.3 px вместо 252.8 px
      Ошибка изображена на скриншоте Рисунок37.png

  - summary: |
      Вместо "Nothing found!" в списке товаров для покупки выдает весь список 
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
      2 версия веб-приложения https://products-store-v2.hexlet.app/ 
    steps-to-reproduce: |
      Открыть страницу со списком товаров в корзине
      Выбрать Essence в фильтре Brand
      Убрать In Stock
    expected-result: |
      Вместо списка товаров для покупки отображается надпись "Nothing found!"
    actual-result: |
      Вместо надписи "Nothing found!" в списке товаров для покупки отображается весь список товаров
      Ошибка изображена на скриншоте Рисунок38.png

  - summary: |
      Сайт не оптимизирован для скорости интернета 3G
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
      2 версия веб-приложения https://products-store-v2.hexlet.app/ 
    steps-to-reproduce: |
      Открыть страницу со списком товаров для покупки
      Открыть DevTools
      Нажать "Ctrl+Shift+M"
      В выпадающем списке нажать 3G 
      Перезагрузить страницу
    expected-result: |
      Пользователь сначала видит спиннер, затем текст страницы со списком товаров для покупки и затем изображения
    actual-result: |
      Пользователь в течение 9 секунд видит белый экран, только после этого появляется спиннер, затем текст и изображения
      Ошибка изображена на скриншоте Рисунок43.png

  - summary: |
      После перезагрузки страницы перевод на русский не сохраняется
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
      2 версия веб-приложения https://products-store-v2.hexlet.app/ 
    steps-to-reproduce: |
      Нажать на кнопку "Language"
      Выбрать Russian 
      Перезагрузить страницу
    expected-result: |
      Перевод сайта на русский сохранился
    actual-result: |
      Перевод сайта сбрасывается до английского, который стоит по умолчанию 

  - summary: |
      После перезагрузки страницы перевод на испанский не сохраняется
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
      2 версия веб-приложения https://products-store-v2.hexlet.app/ 
    steps-to-reproduce: |
      Нажать на кнопку "Language"
      Выбрать Spanish 
      Перезагрузить страницу
    expected-result: |
      Перевод сайта на испанский сохранился
    actual-result: |
      Перевод сайта сбрасывается до английского, который стоит по умолчанию 

  - summary: |
      Корзину невозможно сразу полностью очистить
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
      2 версия веб-приложения https://products-store-v2.hexlet.app/ 
    steps-to-reproduce: |
      Открыть каталог товаров
      Нажать на кнопку "Add to cart" в карточке первого товара
      Нажать на кнопку "Cart"
      Нажать на кнопку "Clear cart"
      Нажать на кнопку "Store"
    expected-result: |
      Рядом с кнопкой "Cart" нет цифр, в самой корзине нет товаров
    actual-result: |
      Рядом с кнопкой "Cart" есть цифра 1, в самой корзине есть один товар

  - summary: |
      Конопка хэштега категории на странице подробной информации о товаре не функциональна
    environment: |
      Яндекс Браузер 26.8.1.966 (64-bit)
      Windows10
      2 версия веб-приложения https://products-store-v2.hexlet.app/ 
    steps-to-reproduce: |
      Открыть каталог товаров
      Нажать на кнопку "Next" до последней страницы
      Нажать на карточку товара Brown Leather Belt Watch
      Нажать на кнопку "#mens-watches"
    expected-result: |
      Происходит редирект на страницу каталога с товарами категории mens-watches
    actual-result: |
      Происходит редирект только на первую страницу каталога со всеми товарами, что были на ней изначально, навигация пропала, перезагрузка не помогает
