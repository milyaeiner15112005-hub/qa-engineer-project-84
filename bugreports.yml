- summary: |
    Подсказка максимальной цены в поле ввода фильтра не соответствует реальности
  environment: |
    Яндекс Браузер 26.8.1.966 (64-bit)
    Windows10
    1 версия веб-приложения https://products-store.hexlet.app/ 
  steps-to-reproduce: |
    Открыть страницу каталога товаров
    Ввести цену From 6576 - To 6577
  expected-result: |
    В каталоге остается товар по фильтрованной цене
  actual-result: |
    Товаров в каталоге не осталось, отображается надпись "Nothing found!"
    Подсказка максимальной цены является суммой цен товаров на выбранной странице без скидки
