---
- summary: |
    Поиск товара по ключевому слову, по наличию и цене осуществляется только в рамках открытой страницы каталога
  environment: |
    Яндекс Браузер 26.8.1.966 (64-bit)
    Windows10
    1 версия веб-приложения https://products-store.hexlet.app/ 
  steps-to-reproduce: |
    Открыть первую страницу каталога
    Ввести отдельно в поиск "Milk"
    Выбрать отдельно In Stock
    Ввести отдельно Price "From 0 - To 4"
  expected-result: |
    В каталоге остался товар Milk
  actual-result: |
    В каталоге не осталось товаров, отображается надпись "Nothing found!"

- summary: |
    В карточке товара не отображается рейтинг
  environment: |
    Яндекс Браузер 26.8.1.966 (64-bit)
    Windows10
    1 версия веб-приложения https://products-store.hexlet.app/ 
  steps-to-reproduce: |
    Нажать на кнопку "Store"
  expected-result: |
    Пользователь видит страницу со списком товаров для покупки, где у каждого товара отображается название, рейтинг, цена со скидкой и без нее
  actual-result: |
    Отображается все, что необходимо, кроме рейтинга товара

- summary: |
    Клик для открытия подробной информации о товаре можно сделать даже за пределами его карточки
  environment: |
    Яндекс Браузер 26.8.1.966 (64-bit)
    Windows10
    1 версия веб-приложения https://products-store.hexlet.app/ 
  steps-to-reproduce: |
    Открыть страницу каталога
    Нажать на 2 миллиметра левее или правее карточки товара
  expected-result: |
    Данное действие некликабельно, ничего не происходит
  actual-result: |
    Пользователь видит страницу с названием выбранного товара, его рейтингом, ценой со скидкой и без нее
    Ошибка изображена на скриншоте Рисунок53.png 

- summary: |
    Сайт не адаптивен к мобильной версии iPhone SE
  environment: |
    Яндекс Браузер 26.8.1.966 (64-bit)
    Windows10
    1 версия веб-приложения https://products-store.hexlet.app/ 
  steps-to-reproduce: |
    Открыть DevTools
    Нажимаем Ctrl+Shift+M
    Выбираем iPhone SE в Dimensions
    Посмотреть каталог товаров
    Выставить фильтры
    Открыть подробную информацию о товаре
    Добавить в корзину
    Перейти в корзину
    Оформить заказ
  expected-result: |
    Все элементы сайта никуда не съехали, за края блока не вылезли, все читабельно, кнопки кликабельны и функциональны
  actual-result: |
    Текст и поля для ввода в фильтре, текст на странице корзины съехали и выходят за пределы блока
    Ошибка изображена на скриншотах Рисунок24.png, Рисунок25.png и Рисунок26.png

