- summary: |
    Сервер возвращает заказ товара с ошибкой 500
  environment: |
    Яндекс Браузер 26.8.1.966 (64-bit)
    Windows10
    1 версия веб-приложения https://products-store.hexlet.app/ 
  steps-to-reproduce: |
    Открыть страницу со списком товаров в корзине
    Нажать на кнопку "Add to cart" в первой карточке товара
    Нажать на кнопку "Cart"
    Открыть Network в DevTools
    Нажать на кнопку "Checkout"
  expected-result: |
    Сервер обработал запрос со статусом 200 ОК
  actual-result: |
    Сервер обработал запрос со статусом 500 Internal Server Error
    Ошибка изображена на скриншоте Рисунок31.png

